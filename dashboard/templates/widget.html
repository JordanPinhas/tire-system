<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>שאל את הצמיגאי AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0d1117;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #161b22;
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #30363d;
        }
        .header h4 { font-size: 1rem; color: #58a6ff; }
        .header p  { font-size: 0.8rem; color: #8b949e; }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .msg {
            max-width: 80%;
            padding: 0.6rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .msg.user {
            background: #1f6feb;
            align-self: flex-start;
        }
        .msg.bot {
            background: #21262d;
            align-self: flex-end;
            border: 1px solid #30363d;
        }
        .input-area {
            padding: 1rem;
            background: #161b22;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 0.5rem;
        }
        .input-area input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 0.6rem 1rem;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        .input-area input:focus { border-color: #58a6ff; }
        .input-area button {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .input-area button:hover { background: #2ea043; }
        .typing {
            color: #8b949e;
            font-size: 0.8rem;
            padding: 0 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h4>🏢 מערכת צמיגים AI</h4>
        <p>שאל אותי כל שאלה על צמיגים, מחירים וזמינות</p>
    </div>
    <div class="messages" id="messages">
        <div class="msg bot">
            שלום! אני הצמיגאי החכם. אשמח לעזור לך עם שאלות על צמיגים,
            מחירים, המלצות ועוד. במה אוכל לעזור? 🚗
        </div>
    </div>
    <div class="typing" id="typing">מקליד...</div>
    <div class="input-area">
        <input type="text" id="user-input"
               placeholder="כתוב שאלה..."
               onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">שלח</button>
    </div>
    <script>
    async function sendMsg() {
        const input = document.getElementById('user-input');
        const msg   = input.value.trim();
        if (!msg) return;
        input.value = '';

        addMessage(msg, 'user');
        document.getElementById('typing').style.display = 'block';

        try {
            const res  = await fetch('/api/widget/chat', {
                method:  'POST',
                headers: {'Content-Type': 'application/json'},
                body:    JSON.stringify({ message: msg })
            });
            const data = await res.json();
            addMessage(data.reply || data.error, 'bot');
        } catch(e) {
            addMessage('שגיאת תקשורת, נסה שנית', 'bot');
        } finally {
            document.getElementById('typing').style.display = 'none';
        }
    }

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.textContent = text;
        const msgs = document.getElementById('messages');
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
    }
    </script>
</body>
</html>
