services:
  - type: web
    name: tire-system-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: "mkdir -p /opt/render/project/src/outputs/marketing && gunicorn dashboard.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
